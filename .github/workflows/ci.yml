name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main, "feature/**", "fix/**"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Install pinned uv
        run: python -m pip install --upgrade pip uv==0.13.5
      - name: Install project and development tools
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: Check workflow and dependency metadata
        run: uv run python -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb'))"
